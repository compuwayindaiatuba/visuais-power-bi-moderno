<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
  <defs>
    <linearGradient id="darkGrad" x1="1" y1="2" x2="19" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4B5563"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="1" y1="2" x2="18" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBFBFD"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="2" y1="4" x2="10" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C4DFF"/>
      <stop offset="1" stop-color="#6A45E8"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="2" y1="7" x2="10" y2="9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="2" y1="10" x2="10" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#F39C34"/>
    </linearGradient>
    <linearGradient id="softTrack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8EAF5"/>
      <stop offset="1" stop-color="#E2E5F0"/>
    </linearGradient>
    <linearGradient id="softPanel" x1="2" y1="12" x2="14" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6F4FF"/>
      <stop offset="1" stop-color="#F3F2FC"/>
    </linearGradient>
    <linearGradient id="orangeLogo" x1="13" y1="13" x2="18" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5A1F"/>
      <stop offset="1" stop-color="#F4511E"/>
    </linearGradient>
  </defs>

  <!-- Outer card -->
  <rect x="1.1" y="1.1" width="17.8" height="17.8" rx="1.1" fill="url(#panelGrad)" stroke="#E9EAF2" stroke-width="0.12"/>

  <!-- Header -->
  <rect x="2.4" y="2.2" width="5.8" height="0.7" rx="0.18" fill="url(#darkGrad)"/>
  <rect x="15.0" y="2.2" width="2.5" height="0.52" rx="0.18" fill="url(#purpleGrad)" opacity="0.95"/>

  <!-- Row 1 icon -->
  <circle cx="3.4" cy="5.1" r="0.9" stroke="url(#purpleGrad)" stroke-width="0.14" fill="none"/>
  <path d="M3.4 4.55 L3.63 4.93 L3.4 5.33 L3.17 4.93 Z" fill="url(#purpleGrad)"/>
  <circle cx="3.4" cy="4.93" r="0.09" fill="#FFFFFF"/>
  <rect x="5.0" y="4.72" width="2.0" height="0.42" rx="0.16" fill="url(#darkGrad)"/>
  <rect x="8.0" y="4.72" width="6.1" height="0.35" rx="0.17" fill="url(#softTrack)"/>
  <rect x="8.0" y="4.72" width="5.1" height="0.35" rx="0.17" fill="url(#purpleGrad)"/>
  <rect x="15.1" y="4.72" width="1.8" height="0.42" rx="0.16" fill="url(#darkGrad)"/>

  <!-- Row 2 icon -->
  <circle cx="3.4" cy="7.9" r="0.9" stroke="url(#blueGrad)" stroke-width="0.14" fill="none"/>
  <path d="M3.15 8.22 V7.9 C3.15 7.57 3.41 7.31 3.74 7.31 C4.03 7.31 4.26 7.55 4.26 7.83 V8.22" stroke="url(#blueGrad)" stroke-width="0.12" stroke-linecap="round"/>
  <circle cx="3.42" cy="7.66" r="0.14" stroke="url(#blueGrad)" stroke-width="0.1" fill="none"/>
  <circle cx="3.52" cy="7.66" r="0.05" fill="url(#blueGrad)"/>
  <rect x="5.0" y="7.52" width="1.8" height="0.42" rx="0.16" fill="url(#darkGrad)"/>
  <rect x="8.0" y="7.52" width="6.1" height="0.35" rx="0.17" fill="url(#softTrack)"/>
  <rect x="8.0" y="7.52" width="4.95" height="0.35" rx="0.17" fill="url(#blueGrad)"/>
  <rect x="15.1" y="7.52" width="1.7" height="0.42" rx="0.16" fill="url(#darkGrad)"/>

  <!-- Row 3 icon -->
  <circle cx="3.4" cy="10.7" r="0.9" stroke="url(#orangeGrad)" stroke-width="0.14" fill="none"/>
  <path d="M3.28 10.18 C3.02 10.46 3.03 10.86 3.28 11.08 C3.53 11.3 3.91 11.24 4.02 10.96 C4.1 10.73 3.99 10.49 3.82 10.38 C3.84 10.6 3.74 10.79 3.56 10.86 C3.5 10.57 3.43 10.38 3.28 10.18 Z" fill="url(#orangeGrad)"/>
  <rect x="5.0" y="10.32" width="1.85" height="0.42" rx="0.16" fill="url(#darkGrad)"/>
  <rect x="8.0" y="10.32" width="6.1" height="0.35" rx="0.17" fill="url(#softTrack)"/>
  <rect x="8.0" y="10.32" width="4.75" height="0.35" rx="0.17" fill="url(#orangeGrad)"/>
  <rect x="15.1" y="10.32" width="1.75" height="0.42" rx="0.16" fill="url(#darkGrad)"/>

  <!-- Bottom highlight card -->
  <rect x="2.2" y="13.0" width="15.4" height="4.1" rx="0.55" fill="url(#softPanel)"/>
  <circle cx="3.55" cy="14.4" r="0.55" stroke="url(#purpleGrad)" stroke-width="0.12" fill="none"/>
  <path d="M3.28 14.9 L3.4 14.55 H3.7 L3.82 14.9 L3.95 14.78 L4.02 15.18 L3.72 15.02 L3.55 15.18 L3.38 15.02 L3.08 15.18 L3.15 14.78 Z" fill="url(#purpleGrad)"/>
  <rect x="4.95" y="13.85" width="3.6" height="0.34" rx="0.14" fill="url(#purpleGrad)" opacity="0.95"/>
  <rect x="4.95" y="14.9" width="5.9" height="0.62" rx="0.18" fill="url(#darkGrad)"/>

  <!-- School logo badge -->
  <circle cx="15.85" cy="15.05" r="1.55" fill="#FFFFFF" stroke="url(#darkGrad)" stroke-width="0.18"/>
  <path d="M17.08 14.34 A1.22 1.22 0 1 0 17.08 15.76 L16.52 15.34 A0.56 0.56 0 1 1 16.52 14.76 Z" fill="url(#orangeLogo)"/>
  <circle cx="15.85" cy="15.05" r="0.32" fill="url(#orangeLogo)"/>
</svg>

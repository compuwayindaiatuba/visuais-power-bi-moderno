<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
  <defs>
    <linearGradient id="darkGrad" x1="1" y1="2" x2="19" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4B5563"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="1" y1="2" x2="18" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBFBFD"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="3" y1="5" x2="14" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2C6CF6"/>
      <stop offset="1" stop-color="#2D8BF0"/>
    </linearGradient>
    <linearGradient id="blueSoft" x1="2" y1="6" x2="10" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF2FF"/>
      <stop offset="1" stop-color="#DCEAFF"/>
    </linearGradient>
    <linearGradient id="purpleSoft" x1="6" y1="6" x2="15" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2EEFF"/>
      <stop offset="1" stop-color="#E7DEFF"/>
    </linearGradient>
    <linearGradient id="orangeSoft" x1="8" y1="8" x2="16" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF3E7"/>
      <stop offset="1" stop-color="#FFE7CF"/>
    </linearGradient>
    <linearGradient id="mutedGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6ECF6"/>
      <stop offset="1" stop-color="#DCE4F0"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="13" y1="12" x2="18" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5A1F"/>
      <stop offset="1" stop-color="#F4511E"/>
    </linearGradient>
  </defs>

  <!-- Outer card -->
  <rect x="1.15" y="1.2" width="17.7" height="17.2" rx="1.0" fill="url(#panelGrad)" stroke="#E9EAF2" stroke-width="0.12"/>

  <!-- Title -->
  <rect x="2.2" y="2.2" width="5.6" height="0.68" rx="0.2" fill="url(#darkGrad)"/>
  <rect x="2.2" y="3.95" width="2.9" height="0.32" rx="0.12" fill="url(#darkGrad)" opacity="0.95"/>
  <rect x="10.0" y="3.95" width="3.2" height="0.32" rx="0.12" fill="url(#darkGrad)" opacity="0.95"/>

  <!-- Treemap area -->
  <rect x="2.2" y="5.15" width="11.95" height="9.35" rx="0.38" fill="#FFFFFF" stroke="url(#mutedGrad)" stroke-width="0.10"/>

  <!-- Left large block -->
  <rect x="2.55" y="5.5" width="4.5" height="5.85" rx="0.28" fill="url(#blueGrad)"/>
  <rect x="3.0" y="6.15" width="1.8" height="0.24" rx="0.12" fill="#FFFFFF" opacity="0.95"/>
  <rect x="3.0" y="6.7" width="1.15" height="0.18" rx="0.09" fill="#DCEBFF"/>

  <!-- Top middle -->
  <rect x="7.4" y="5.5" width="2.65" height="2.8" rx="0.24" fill="url(#blueSoft)" stroke="#D9E5FB" stroke-width="0.08"/>
  <rect x="7.8" y="6.0" width="1.2" height="0.2" rx="0.1" fill="url(#darkGrad)"/>
  <rect x="7.8" y="6.45" width="0.9" height="0.16" rx="0.08" fill="url(#mutedGrad)"/>

  <!-- Top right -->
  <rect x="10.4" y="5.5" width="3.4" height="2.8" rx="0.24" fill="url(#purpleSoft)" stroke="#E5DCF9" stroke-width="0.08"/>
  <rect x="10.8" y="6.0" width="1.45" height="0.2" rx="0.1" fill="url(#darkGrad)"/>
  <rect x="10.8" y="6.45" width="1.0" height="0.16" rx="0.08" fill="url(#mutedGrad)"/>

  <!-- Bottom middle left -->
  <rect x="7.4" y="8.65" width="2.65" height="2.7" rx="0.24" fill="url(#orangeSoft)" stroke="#F7DFC2" stroke-width="0.08"/>
  <rect x="7.8" y="9.1" width="1.15" height="0.2" rx="0.1" fill="url(#darkGrad)"/>
  <rect x="7.8" y="9.55" width="0.8" height="0.16" rx="0.08" fill="url(#mutedGrad)"/>

  <!-- Bottom right large -->
  <rect x="10.4" y="8.65" width="3.4" height="2.7" rx="0.24" fill="url(#blueSoft)" stroke="#D9E5FB" stroke-width="0.08"/>
  <rect x="10.8" y="9.1" width="1.5" height="0.2" rx="0.1" fill="url(#darkGrad)"/>
  <rect x="10.8" y="9.55" width="1.1" height="0.16" rx="0.08" fill="url(#mutedGrad)"/>

  <!-- Bottom row summary blocks -->
  <rect x="2.55" y="11.7" width="2.85" height="2.45" rx="0.22" fill="url(#blueSoft)" stroke="#D9E5FB" stroke-width="0.08"/>
  <rect x="5.7" y="11.7" width="2.1" height="2.45" rx="0.22" fill="url(#purpleSoft)" stroke="#E5DCF9" stroke-width="0.08"/>
  <rect x="8.1" y="11.7" width="2.2" height="2.45" rx="0.22" fill="url(#orangeSoft)" stroke="#F7DFC2" stroke-width="0.08"/>
  <rect x="10.6" y="11.7" width="3.2" height="2.45" rx="0.22" fill="url(#blueGrad)" opacity="0.9"/>

  <rect x="3.0" y="12.15" width="1.1" height="0.18" rx="0.09" fill="url(#darkGrad)"/>
  <rect x="6.0" y="12.15" width="0.8" height="0.18" rx="0.09" fill="url(#darkGrad)"/>
  <rect x="8.45" y="12.15" width="0.95" height="0.18" rx="0.09" fill="url(#darkGrad)"/>
  <rect x="11.0" y="12.15" width="1.3" height="0.18" rx="0.09" fill="#FFFFFF" opacity="0.95"/>

  <!-- School logo badge -->
  <circle cx="15.75" cy="15.0" r="2.0" fill="#FFFFFF" stroke="url(#darkGrad)" stroke-width="0.54"/>
  <path d="M17.32 14.09 A1.58 1.58 0 1 0 17.32 15.89 L16.62 15.37 A0.72 0.72 0 1 1 16.62 14.61 Z" fill="url(#orangeGrad)"/>
  <circle cx="15.75" cy="15.0" r="0.42" fill="url(#orangeGrad)"/>
</svg>

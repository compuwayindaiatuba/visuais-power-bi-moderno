<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
  <defs>
    <linearGradient id="darkGrad" x1="1" y1="2" x2="19" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4B5563"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="1" y1="2" x2="18" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBFBFD"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="3" y1="5" x2="14" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2C6CF6"/>
      <stop offset="1" stop-color="#2D8BF0"/>
    </linearGradient>
    <linearGradient id="blueSoft" x1="2" y1="6" x2="10" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ECF4FF"/>
      <stop offset="1" stop-color="#DDEBFF"/>
    </linearGradient>
    <linearGradient id="purpleSoft" x1="6" y1="6" x2="15" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2EEFF"/>
      <stop offset="1" stop-color="#E6DDFF"/>
    </linearGradient>
    <linearGradient id="orangeSoft" x1="8" y1="8" x2="16" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF4E9"/>
      <stop offset="1" stop-color="#FFE5C8"/>
    </linearGradient>
    <linearGradient id="mutedGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6ECF6"/>
      <stop offset="1" stop-color="#DCE4F0"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="13" y1="12" x2="18" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5A1F"/>
      <stop offset="1" stop-color="#F4511E"/>
    </linearGradient>
  </defs>

  <!-- Outer card -->
  <rect x="1.15" y="1.2" width="17.7" height="17.2" rx="1.0" fill="url(#panelGrad)" stroke="#E9EAF2" stroke-width="0.12"/>

  <!-- Title -->
  <rect x="2.15" y="2.15" width="5.9" height="0.68" rx="0.2" fill="url(#darkGrad)"/>
  <rect x="2.15" y="3.92" width="2.45" height="0.32" rx="0.12" fill="url(#darkGrad)" opacity="0.95"/>
  <rect x="9.8" y="3.92" width="3.55" height="0.32" rx="0.12" fill="url(#darkGrad)" opacity="0.95"/>

  <!-- Treemap frame -->
  <rect x="2.15" y="5.1" width="11.95" height="9.45" rx="0.38" fill="#FFFFFF" stroke="url(#mutedGrad)" stroke-width="0.10"/>

  <!-- Layout variant 2 -->
  <!-- top left dominant -->
  <rect x="2.5" y="5.45" width="5.35" height="3.0" rx="0.26" fill="url(#blueGrad)"/>
  <rect x="3.0" y="6.0" width="2.0" height="0.24" rx="0.12" fill="#FFFFFF" opacity="0.96"/>
  <rect x="3.0" y="6.5" width="1.3" height="0.17" rx="0.085" fill="#DCEBFF"/>

  <!-- top right stack -->
  <rect x="8.2" y="5.45" width="2.2" height="1.4" rx="0.22" fill="url(#purpleSoft)" stroke="#E4DBFA" stroke-width="0.08"/>
  <rect x="10.75" y="5.45" width="3.0" height="1.4" rx="0.22" fill="url(#orangeSoft)" stroke="#F7DFC2" stroke-width="0.08"/>
  <rect x="8.2" y="7.2" width="2.2" height="1.25" rx="0.22" fill="url(#blueSoft)" stroke="#D8E5FB" stroke-width="0.08"/>
  <rect x="10.75" y="7.2" width="3.0" height="1.25" rx="0.22" fill="url(#purpleSoft)" stroke="#E4DBFA" stroke-width="0.08"/>

  <!-- bottom left mosaic -->
  <rect x="2.5" y="8.8" width="2.45" height="2.25" rx="0.22" fill="url(#blueSoft)" stroke="#D8E5FB" stroke-width="0.08"/>
  <rect x="5.3" y="8.8" width="2.55" height="2.25" rx="0.22" fill="url(#orangeSoft)" stroke="#F7DFC2" stroke-width="0.08"/>

  <!-- bottom right large -->
  <rect x="8.2" y="8.8" width="5.55" height="3.9" rx="0.26" fill="url(#blueGrad)" opacity="0.92"/>
  <rect x="8.75" y="9.45" width="2.1" height="0.24" rx="0.12" fill="#FFFFFF" opacity="0.96"/>
  <rect x="8.75" y="9.95" width="1.4" height="0.17" rx="0.085" fill="#DCEBFF"/>

  <!-- bottom row small summary -->
  <rect x="2.5" y="11.4" width="1.95" height="2.8" rx="0.2" fill="url(#purpleSoft)" stroke="#E4DBFA" stroke-width="0.08"/>
  <rect x="4.75" y="11.4" width="1.75" height="2.8" rx="0.2" fill="url(#blueSoft)" stroke="#D8E5FB" stroke-width="0.08"/>
  <rect x="6.8" y="11.4" width="1.05" height="2.8" rx="0.2" fill="url(#orangeSoft)" stroke="#F7DFC2" stroke-width="0.08"/>

  <!-- tiny label hints -->
  <rect x="8.55" y="5.9" width="0.95" height="0.14" rx="0.07" fill="url(#darkGrad)"/>
  <rect x="11.1" y="5.9" width="1.25" height="0.14" rx="0.07" fill="url(#darkGrad)"/>
  <rect x="8.55" y="7.62" width="0.85" height="0.14" rx="0.07" fill="url(#darkGrad)"/>
  <rect x="11.1" y="7.62" width="1.15" height="0.14" rx="0.07" fill="url(#darkGrad)"/>
  <rect x="2.95" y="9.3" width="0.95" height="0.14" rx="0.07" fill="url(#darkGrad)"/>
  <rect x="5.7" y="9.3" width="1.0" height="0.14" rx="0.07" fill="url(#darkGrad)"/>
  <rect x="2.9" y="11.88" width="0.75" height="0.14" rx="0.07" fill="url(#darkGrad)"/>
  <rect x="5.05" y="11.88" width="0.6" height="0.14" rx="0.07" fill="url(#darkGrad)"/>
  <rect x="6.98" y="11.88" width="0.42" height="0.14" rx="0.07" fill="url(#darkGrad)"/>

  <!-- School logo badge -->
  <circle cx="15.7" cy="15.0" r="2.0" fill="#FFFFFF" stroke="url(#darkGrad)" stroke-width="0.54"/>
  <path d="M17.27 14.09 A1.58 1.58 0 1 0 17.27 15.89 L16.57 15.37 A0.72 0.72 0 1 1 16.57 14.61 Z" fill="url(#orangeGrad)"/>
  <circle cx="15.7" cy="15.0" r="0.42" fill="url(#orangeGrad)"/>
</svg>

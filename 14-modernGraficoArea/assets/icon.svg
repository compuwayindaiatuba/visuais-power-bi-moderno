<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
  <defs>
    <linearGradient id="darkGrad" x1="1" y1="2" x2="19" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4B5563"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="1" y1="2" x2="18" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBFBFD"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="4" y1="5" x2="13" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2C6CF6"/>
      <stop offset="1" stop-color="#2D8BF0"/>
    </linearGradient>
    <linearGradient id="areaFill" x1="4" y1="7" x2="12" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BFD7FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#E6F0FF" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="mutedGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6ECF6"/>
      <stop offset="1" stop-color="#DCE4F0"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="13" y1="12" x2="18" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5A1F"/>
      <stop offset="1" stop-color="#F4511E"/>
    </linearGradient>
  </defs>

  <!-- Outer card -->
  <rect x="1.15" y="1.2" width="17.7" height="17.2" rx="1.0" fill="url(#panelGrad)" stroke="#E9EAF2" stroke-width="0.12"/>

  <!-- Title -->
  <rect x="2.2" y="2.2" width="5.2" height="0.68" rx="0.2" fill="url(#darkGrad)"/>
  <rect x="2.2" y="3.95" width="2.45" height="0.32" rx="0.12" fill="url(#darkGrad)" opacity="0.95"/>
  <rect x="9.9" y="3.95" width="3.2" height="0.32" rx="0.12" fill="url(#darkGrad)" opacity="0.95"/>

  <!-- Chart frame -->
  <rect x="2.2" y="5.15" width="11.95" height="9.45" rx="0.38" fill="#FFFFFF" stroke="url(#mutedGrad)" stroke-width="0.10"/>

  <!-- Grid lines -->
  <path d="M3.0 7.2H13.35" stroke="url(#mutedGrad)" stroke-width="0.08" stroke-linecap="round"/>
  <path d="M3.0 9.3H13.35" stroke="url(#mutedGrad)" stroke-width="0.08" stroke-linecap="round"/>
  <path d="M3.0 11.4H13.35" stroke="url(#mutedGrad)" stroke-width="0.08" stroke-linecap="round"/>

  <!-- Axes -->
  <path d="M3.0 12.95H13.35" stroke="url(#darkGrad)" stroke-width="0.14" stroke-linecap="round"/>
  <path d="M3.0 6.1V12.95" stroke="url(#darkGrad)" stroke-width="0.14" stroke-linecap="round"/>

  <!-- Area fill -->
  <path d="M3.45 12.95
           L3.45 11.75
           C4.15 11.5 4.55 10.75 5.25 10.7
           C6.05 10.62 6.35 11.15 7.1 10.9
           C7.9 10.62 8.2 9.35 9.15 9.25
           C9.95 9.16 10.35 9.95 11.1 9.8
           C11.85 9.65 12.35 8.4 13.0 7.85
           L13.0 12.95 Z"
        fill="url(#areaFill)"/>

  <!-- Line -->
  <path d="M3.45 11.75
           C4.15 11.5 4.55 10.75 5.25 10.7
           C6.05 10.62 6.35 11.15 7.1 10.9
           C7.9 10.62 8.2 9.35 9.15 9.25
           C9.95 9.16 10.35 9.95 11.1 9.8
           C11.85 9.65 12.35 8.4 13.0 7.85"
        stroke="url(#blueGrad)" stroke-width="0.30" stroke-linecap="round" fill="none"/>

  <!-- Highlight points -->
  <circle cx="5.25" cy="10.7" r="0.17" fill="url(#blueGrad)"/>
  <circle cx="7.1" cy="10.9" r="0.17" fill="url(#blueGrad)"/>
  <circle cx="9.15" cy="9.25" r="0.17" fill="url(#blueGrad)"/>
  <circle cx="11.1" cy="9.8" r="0.17" fill="url(#blueGrad)"/>
  <circle cx="13.0" cy="7.85" r="0.17" fill="url(#blueGrad)"/>

  <!-- Bottom labels -->
  <rect x="3.35" y="13.45" width="0.95" height="0.16" rx="0.08" fill="url(#mutedGrad)"/>
  <rect x="5.55" y="13.45" width="0.95" height="0.16" rx="0.08" fill="url(#mutedGrad)"/>
  <rect x="7.75" y="13.45" width="0.95" height="0.16" rx="0.08" fill="url(#mutedGrad)"/>
  <rect x="9.95" y="13.45" width="0.95" height="0.16" rx="0.08" fill="url(#mutedGrad)"/>
  <rect x="12.15" y="13.45" width="0.95" height="0.16" rx="0.08" fill="url(#mutedGrad)"/>

  <!-- School logo badge -->
  <circle cx="15.75" cy="15.0" r="2.0" fill="#FFFFFF" stroke="url(#darkGrad)" stroke-width="0.54"/>
  <path d="M17.32 14.09 A1.58 1.58 0 1 0 17.32 15.89 L16.62 15.37 A0.72 0.72 0 1 1 16.62 14.61 Z" fill="url(#orangeGrad)"/>
  <circle cx="15.75" cy="15.0" r="0.42" fill="url(#orangeGrad)"/>
</svg>

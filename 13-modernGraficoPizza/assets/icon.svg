<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
  <defs>
    <linearGradient id="darkGrad" x1="1" y1="2" x2="19" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4B5563"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="1" y1="2" x2="18" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBFBFD"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="4" y1="5" x2="12" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2C6CF6"/>
      <stop offset="1" stop-color="#2D8BF0"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="5" y1="6" x2="13" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#7C4DFF"/>
    </linearGradient>
    <linearGradient id="orangeSlice" x1="5" y1="8" x2="12" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="4" y1="5" x2="12" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF2FF"/>
      <stop offset="1" stop-color="#DCEAFF"/>
    </linearGradient>
    <linearGradient id="mutedGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6ECF6"/>
      <stop offset="1" stop-color="#DCE4F0"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="13" y1="12" x2="18" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5A1F"/>
      <stop offset="1" stop-color="#F4511E"/>
    </linearGradient>
  </defs>

  <!-- Outer card -->
  <rect x="1.15" y="1.2" width="17.7" height="17.2" rx="1.0" fill="url(#panelGrad)" stroke="#E9EAF2" stroke-width="0.12"/>

  <!-- Title -->
  <rect x="2.2" y="2.2" width="5.1" height="0.68" rx="0.2" fill="url(#darkGrad)"/>
  <rect x="2.2" y="3.95" width="2.4" height="0.32" rx="0.12" fill="url(#darkGrad)" opacity="0.95"/>
  <rect x="9.9" y="3.95" width="3.0" height="0.32" rx="0.12" fill="url(#darkGrad)" opacity="0.95"/>

  <!-- Chart frame -->
  <rect x="2.2" y="5.15" width="11.95" height="9.45" rx="0.38" fill="#FFFFFF" stroke="url(#mutedGrad)" stroke-width="0.10"/>

  <!-- Pie chart -->
  <circle cx="7.85" cy="10.0" r="3.1" fill="url(#softBlue)"/>

  <!-- blue slice -->
  <path d="M7.85 10 L7.85 6.9
           A3.1 3.1 0 0 1 10.56 8.49 Z"
        fill="url(#blueGrad)"/>

  <!-- purple slice -->
  <path d="M7.85 10 L10.56 8.49
           A3.1 3.1 0 0 1 9.47 12.65 Z"
        fill="url(#purpleGrad)"/>

  <!-- orange slice -->
  <path d="M7.85 10 L9.47 12.65
           A3.1 3.1 0 0 1 5.16 11.54 Z"
        fill="url(#orangeSlice)"/>

  <!-- light remaining slice -->
  <path d="M7.85 10 L5.16 11.54
           A3.1 3.1 0 0 1 7.85 6.9 Z"
        fill="#DCEAFF"/>

  <!-- donut center -->
  <circle cx="7.85" cy="10.0" r="1.2" fill="#FFFFFF"/>

  <!-- Small legend -->
  <rect x="11.15" y="7.35" width="0.42" height="0.42" rx="0.1" fill="url(#blueGrad)"/>
  <rect x="11.85" y="7.46" width="1.55" height="0.20" rx="0.1" fill="url(#darkGrad)"/>

  <rect x="11.15" y="8.7" width="0.42" height="0.42" rx="0.1" fill="url(#purpleGrad)"/>
  <rect x="11.85" y="8.81" width="1.35" height="0.20" rx="0.1" fill="url(#darkGrad)"/>

  <rect x="11.15" y="10.05" width="0.42" height="0.42" rx="0.1" fill="url(#orangeSlice)"/>
  <rect x="11.85" y="10.16" width="1.7" height="0.20" rx="0.1" fill="url(#darkGrad)"/>

  <rect x="11.15" y="11.4" width="0.42" height="0.42" rx="0.1" fill="#DCEAFF"/>
  <rect x="11.85" y="11.51" width="1.2" height="0.20" rx="0.1" fill="url(#darkGrad)"/>

  <!-- School logo badge -->
  <circle cx="15.75" cy="15.0" r="2.0" fill="#FFFFFF" stroke="url(#darkGrad)" stroke-width="0.54"/>
  <path d="M17.32 14.09 A1.58 1.58 0 1 0 17.32 15.89 L16.62 15.37 A0.72 0.72 0 1 1 16.62 14.61 Z" fill="url(#orangeGrad)"/>
  <circle cx="15.75" cy="15.0" r="0.42" fill="url(#orangeGrad)"/>
</svg>

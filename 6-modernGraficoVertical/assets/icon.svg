<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
  <defs>
    <linearGradient id="darkGrad" x1="1" y1="2" x2="19" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4B5563"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="1" y1="2" x2="18" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBFBFD"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="5" y1="6" x2="14" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2C6CF6"/>
      <stop offset="1" stop-color="#2D8BF0"/>
    </linearGradient>
    <linearGradient id="mutedGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6ECF6"/>
      <stop offset="1" stop-color="#DCE4F0"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="13" y1="12" x2="18" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5A1F"/>
      <stop offset="1" stop-color="#F4511E"/>
    </linearGradient>
  </defs>

  <!-- Outer card -->
  <rect x="1.1" y="1.2" width="17.8" height="17.2" rx="1.0" fill="url(#panelGrad)" stroke="#E9EAF2" stroke-width="0.12"/>

  <!-- Title -->
  <rect x="2.3" y="2.2" width="6.2" height="0.68" rx="0.2" fill="url(#darkGrad)"/>
  <rect x="2.3" y="4.0" width="2.8" height="0.34" rx="0.12" fill="url(#darkGrad)" opacity="0.95"/>
  <rect x="10.0" y="4.0" width="3.9" height="0.34" rx="0.12" fill="url(#darkGrad)" opacity="0.95"/>

  <!-- Divider -->
  <path d="M2.1 4.95 H17.2" stroke="url(#mutedGrad)" stroke-width="0.12" stroke-linecap="round"/>

  <!-- Left department icons / labels -->
  <rect x="2.3" y="6.0" width="0.42" height="0.42" rx="0.08" fill="url(#blueGrad)"/>
  <rect x="2.3" y="7.3" width="0.42" height="0.42" rx="0.08" fill="url(#blueGrad)" opacity="0.95"/>
  <rect x="2.3" y="8.6" width="0.42" height="0.42" rx="0.08" fill="url(#blueGrad)" opacity="0.9"/>
  <rect x="2.3" y="9.9" width="0.42" height="0.42" rx="0.08" fill="url(#blueGrad)" opacity="0.85"/>
  <rect x="2.3" y="11.2" width="0.42" height="0.42" rx="0.08" fill="url(#blueGrad)" opacity="0.8"/>

  <rect x="3.05" y="6.05" width="2.9" height="0.22" rx="0.11" fill="url(#mutedGrad)"/>
  <rect x="3.05" y="7.35" width="2.55" height="0.22" rx="0.11" fill="url(#mutedGrad)"/>
  <rect x="3.05" y="8.65" width="2.75" height="0.22" rx="0.11" fill="url(#mutedGrad)"/>
  <rect x="3.05" y="9.95" width="2.35" height="0.22" rx="0.11" fill="url(#mutedGrad)"/>
  <rect x="3.05" y="11.25" width="2.65" height="0.22" rx="0.11" fill="url(#mutedGrad)"/>

  <!-- Chart area -->
  <path d="M7.2 13.9 H14.65" stroke="url(#darkGrad)" stroke-width="0.16" stroke-linecap="round"/>
  <path d="M7.2 13.9 V5.9" stroke="url(#darkGrad)" stroke-width="0.16" stroke-linecap="round"/>

  <!-- Bars -->
  <rect x="8.0" y="10.5" width="0.9" height="3.4" rx="0.18" fill="url(#blueGrad)"/>
  <rect x="9.45" y="9.2" width="0.9" height="4.7" rx="0.18" fill="url(#blueGrad)"/>
  <rect x="10.9" y="8.1" width="0.9" height="5.8" rx="0.18" fill="url(#blueGrad)"/>
  <rect x="12.35" y="7.0" width="0.9" height="6.9" rx="0.18" fill="url(#blueGrad)"/>

  <!-- Percentage labels bottom -->
  <rect x="7.75" y="14.45" width="1.15" height="0.18" rx="0.09" fill="url(#mutedGrad)"/>
  <rect x="9.2" y="14.45" width="1.15" height="0.18" rx="0.09" fill="url(#mutedGrad)"/>
  <rect x="10.65" y="14.45" width="1.15" height="0.18" rx="0.09" fill="url(#mutedGrad)"/>
  <rect x="12.1" y="14.45" width="1.15" height="0.18" rx="0.09" fill="url(#mutedGrad)"/>
  <rect x="13.55" y="14.45" width="1.15" height="0.18" rx="0.09" fill="url(#mutedGrad)"/>

  <!-- School logo badge -->
  <circle cx="15.55" cy="15.45" r="2.0" fill="#FFFFFF" stroke="url(#darkGrad)" stroke-width="0.54"/>
  <path d="M17.12 14.54 A1.58 1.58 0 1 0 17.12 16.34 L16.42 15.82 A0.72 0.72 0 1 1 16.42 15.06 Z" fill="url(#orangeGrad)"/>
  <circle cx="15.55" cy="15.45" r="0.42" fill="url(#orangeGrad)"/>
</svg>
